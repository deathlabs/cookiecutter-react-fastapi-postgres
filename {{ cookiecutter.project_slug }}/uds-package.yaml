# uds-package.yaml

---
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  namespace: {{ cookiecutter.project_slug }}
  name: {{ cookiecutter.project_slug }}
spec:
  network:
    allow:
      # Allow all the pods in the app to talk to each other.
      - description: Inbound internally
        remoteGenerated: IntraNamespace
        direction: Ingress
        selector:
          app.kubernetes.io/app: {{ cookiecutter.project_slug }}
      - description: Outbound internally
        remoteGenerated: IntraNamespace
        direction: Egress
        selector:
          app.kubernetes.io/app: {{ cookiecutter.project_slug }}
    
    # Allow user traffic to the frontend.
    expose:
      - service: frontend
        selector:
          app.kubernetes.io/component: frontend
        host: {{ cookiecutter.project_slug }}
        port: ###ZARF_VAR_FRONTEND_PORT###

  # Put the frontend behind a MFA-wall.
  sso:
    - name: {{ cookiecutter.project_slug }}
      clientId: {{ cookiecutter.project_slug }}
      redirectUris:
        - https://{{ cookiecutter.project_slug }}.uds.dev/login
      enableAuthserviceSelector:
        app.kubernetes.io/component: frontend
