# frontend/chart/values.yaml

---
app: {{ cookiecutter.project_slug }}
namespace: {{ cookiecutter.project_slug }}
replicaCount: 1
securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
image: 
  pullPolicy: Always
  repository: {{ cookiecutter.project_slug }}/frontend
  tag: latest
service: 
  type: ClusterIP
  name: frontend
  port: "###ZARF_VAR_FRONTEND_PORT###"
backend:
  url: http://backend:8000
volumes:
  - name: logs
    mountPath: /var/log/nginx
  - name: tmp
    mountPath: /var/lib/nginx/tmp
