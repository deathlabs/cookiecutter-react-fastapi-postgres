# uds-package.yaml

---
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  namespace: whalefall
  name: whalefall
spec:
  network:
    allow:
      # Allow all the pods in the app to talk to each other.
      - description: Inbound internally
        remoteGenerated: IntraNamespace
        direction: Ingress
        selector:
          app.kubernetes.io/app: whalefall
      - description: Outbound internally
        remoteGenerated: IntraNamespace
        direction: Egress
        selector:
          app.kubernetes.io/app: whalefall
    
    # Allow user traffic to the frontend.
    expose:
      - service: frontend
        selector:
          app.kubernetes.io/component: frontend
        host: whalefall
        port: 5173

  # Put the frontend behind a MFA-wall.
  sso:
    - name: whalefall
      clientId: whalefall
      redirectUris:
        - https://whalefall.uds.dev/login
      enableAuthserviceSelector:
        app.kubernetes.io/component: frontend
