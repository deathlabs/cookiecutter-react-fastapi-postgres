# database/chart/values.yaml

---
app: whalefall
namespace: whalefall
replicaCount: 1
image:
  pullPolicy: Always
  repository: whalefall/database
  tag: latest
service:
  type: ClusterIP
  name: database
  port: 5432
storage:
  path: /var/lib/postgresql
  size: 5Gi
database:
  name: "###ZARF_VAR_PGDATABASE###"
  user: "###ZARF_VAR_PGUSER###"
  password: "###ZARF_VAR_PGPASSWORD###"
