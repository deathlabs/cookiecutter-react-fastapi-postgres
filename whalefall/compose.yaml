services:
  database:
    profiles: [all, backend, database]
    build: database
    image: whalefall/database:latest
    container_name: whalefall-database
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - database/${ENV_FILE:-.env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whalefall"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  backend:
    profiles: [all, backend]
    build: backend
    image: whalefall/backend:latest
    container_name: whalefall-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/${ENV_FILE:-.env.example}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/health/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  frontend:
    profiles: [all, frontend]
    build:
      context: frontend
      args:
        VITE_BACKEND_URL: http://localhost:8000
    image: whalefall/frontend:latest
    container_name: whalefall-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    env_file:
      - frontend/${ENV_FILE:-.env.example}
    environment:
      FRONTEND_PORT: "${FRONTEND_PORT:-5173}"

volumes:
  database:
