# zarf.yaml

---
kind: ZarfPackageConfig
metadata:
  name: whalefall
  version: 0.1.0
  annotations:
    dev.uds.title: whalefall

variables:
  - name: PGDATABASE
    sensitive: false
    description: Database name
  - name: PGUSER
    sensitive: false
    description: Database user name
  - name: PGPASSWORD
    sensitive: true
    description: Database user password
  - name: FRONTEND_PORT
    sensitive: false
    description: Frontend port

components:
  - name: uds-package
    required: true
    manifests:
      - name: whalefall
        namespace: whalefall
        files:
          - uds-package.yaml
  - name: database
    required: true
    charts:
      - name: database
        version: 0.1.0
        namespace: whalefall
        localPath: database/chart
        valuesFiles:
          - database/chart/values.yaml
    images:
      - whalefall/database:latest
  - name: backend
    required: true
    charts:
      - name: backend
        version: 0.1.0
        namespace: whalefall
        localPath: backend/chart
        valuesFiles:
          - backend/chart/values.yaml
    images:
      - whalefall/backend:latest
  - name: frontend
    required: true
    charts:
      - name: frontend
        version: 0.1.0
        namespace: whalefall
        localPath: frontend/chart
        valuesFiles:
          - frontend/chart/values.yaml
    images:
      - whalefall/frontend:latest
