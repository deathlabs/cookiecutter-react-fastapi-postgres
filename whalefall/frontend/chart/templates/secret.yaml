# frontend/chart/templates/secret.yaml

---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.service.name }}
  labels:
    app.kubernetes.io/app: {{ .Values.app }}
    app.kubernetes.io/component: {{ .Values.service.name }}
type: Opaque
stringData:
  PORT: {{ .Values.service.port | quote }}
  HOSTNAME: {{ .Values.service.hostname | quote }}
